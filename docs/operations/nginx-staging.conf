# SHABLON: domen/certificate/socket yo‘llari operator tomonidan almashtirilsin.
# nginx -t va stagingda test qilinmaguncha install/reload QILMANG.
server {
    listen 80;
    server_name staging.example.invalid;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name staging.example.invalid;
    ssl_certificate /etc/ssl/smart-market/staging/fullchain.pem;
    ssl_certificate_key /etc/ssl/smart-market/staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/smart-market/current/public;
    index index.php;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/smart-market.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    # Private catalog storage public/ ichida emas; nginx alias qo‘shmang.
}
