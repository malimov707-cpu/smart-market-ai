name: Validate application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smart_market_test
          POSTGRES_USER: smart_market
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smart_market -d smart_market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: smart_market_test
      DB_USERNAME: smart_market
      DB_PASSWORD: ci-only-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: php artisan migrate --force
      - run: php artisan test --compact
      - name: Prepare dedicated real-worker test database
        run: PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U smart_market -d postgres -c 'CREATE DATABASE quality_queue_test'
      - name: Verify actual database queue worker
        run: DB_DATABASE=quality_queue_test php artisan test --compact --filter=RealImportQueueTest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: php artisan route:cache
      - run: php artisan config:cache
      - run: composer audit
      - run: npm audit --audit-level=high
